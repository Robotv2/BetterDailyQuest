      1:
        task_type: "BREAK"
        task_description: "&7Ores mined: &f%task_progress%&8/&f%task_required%"
        required_amount: 96
        required_targets:
          - COAL_ORE
          - IRON_ORE
          - GOLD_ORE

  weekly-site-builder:
