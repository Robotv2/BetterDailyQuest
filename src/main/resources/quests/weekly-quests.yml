quests:
  weekly-quarry-worker:
    name: "Quarry Worker"
    description:
      - "&7Clear a substantial amount of stone."
    group: "weekly"
    rewards:
      - "[message] &aQuest complete: &f%quest_name%"
    tasks:
      1:
        task_type: "BREAK"
        task_description: "&7Stone broken: &f%task_progress%&8/&f%task_required%"
        required_amount: 512
        required_targets:
          - STONE
          - COBBLESTONE

  weekly-ore-prospector:
    name: "Ore Prospector"
    description:
      - "&7Mine common metal and fuel ores."
    group: "weekly"
