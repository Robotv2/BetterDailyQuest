quests:
  daily-stonebreaker:
    name: "Stonebreaker"
    description:
      - "&7Break stone or cobblestone."
    group: "daily"
    rewards:
      - "[message] &aQuest complete: &f%quest_name%"
    tasks:
      1:
        task_type: "BREAK"
        task_description: "&7Stone broken: &f%task_progress%&8/&f%task_required%"
        required_amount: 32
        required_targets:
          - STONE
          - COBBLESTONE

  daily-woodcutter:
    name: "Woodcutter"
    description:
      - "&7Gather logs from common tree types."
    group: "daily"
    rewards:
      - "[message] &aQuest complete: &f%quest_name%"
    tasks:
      1:
        task_type: "BREAK"
        task_description: "&7Logs gathered: &f%task_progress%&8/&f%task_required%"
        required_amount: 24
        required_targets:
          - OAK_LOG
          - BIRCH_LOG
          - SPRUCE_LOG
          - JUNGLE_LOG

  daily-builder:
