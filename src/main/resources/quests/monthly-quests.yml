quests:
  monthly-master-miner:
    name: "Master Miner"
    description:
      - "&7Complete a structured month-long mining operation."
    group: "monthly"
    options:
      sequential-tasks: true
    rewards:
      - "[message] &aQuest complete: &f%quest_name%"
    tasks:
      1:
        task_type: "BREAK"
        task_description: "&7Stone broken: &f%task_progress%&8/&f%task_required%"
        required_amount: 2000
        required_targets:
          - STONE
          - COBBLESTONE
      2:
        task_type: "BREAK"
        task_description: "&7Common ores mined: &f%task_progress%&8/&f%task_required%"
        required_amount: 256
        required_targets:
          - COAL_ORE
          - IRON_ORE
          - GOLD_ORE
      3:
        task_type: "BREAK"
        task_description: "&7Diamond ore mined: &f%task_progress%&8/&f%task_required%"
        required_amount: 16
        required_target: DIAMOND_ORE

  monthly-grand-builder:
