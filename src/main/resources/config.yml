debug: true

quest-board:
  title: "&6&lQuest Board &8| &7Quests"
  rows: 6
  filler-item:
    material: BLACK_STAINED_GLASS_PANE
    name: " "
  status:
    waiting: "&eWaiting"
    started: "&aIn progress"
    completed: "&aCompleted"
    unavailable: "&cUnavailable"
  groups:
    daily:
      slots: [10, 11, 12]
      quest-item:
        material: PAPER
        name: "&6&l%quest_name%"
        lore:
          - "%quest_description%"
          - ""
          - "%task_descriptions%"
          - ""
          - "&7Status: %quest_status%"
          - "&7Refresh: &e%quest_reset_time%"
      empty-item:
        material: BARRIER
        name: "&cNo quest assigned"

database:
  type: SQLITE
  mariadb:
    host: "localhost"
    port: 3306
    database: "quest"
    username: "user"
    password: "password"

cosmetics:
  task_increment:
    action_bar:
      enabled: true
      message: "&e%quest_name% &8| &e%task_progress%/%task_required%"
    titles:
      enabled: false
      title: ""
      subtitle: ""
  task_done:
    action_bar:
      enabled: true
      message: "&a%quest_name% &8| &e&lCOMPLETED"
    titles:
      enabled: true
      title: "&aTask completed !"
      subtitle: "&aYou have just finished a task for the quest: %quest_name%"
  quest_done:
    action_bar:
      enabled: false
      message: ""
    titles:
      enabled: true
      title: "&aCongratulations !"
      subtitle: "&aYou have just finished the quest: %quest_name%"

time_format:
  days: "d"
  hours: "h"
  minutes: "m"
  seconds: "s"
  format: "%days%%hours%%minutes%%seconds%"

messages:
  commands:
    reload_success: "&aThe plugin has been reloaded successfully."
    player_not_loaded: "&cThe player is not connected or is not loaded."
    quest_not_found: "&cThe target does not have this quest."
    quest_already_has: "&cThe target already has this quest."
    quest_unavailable: "&cThe quest is not available. (%quest_id%)"
    quest_already_completed: "&cThe quest is already completed."
    quest_already_started: "&cThe quest assignment is already started."
    max_rerolls_reached: "&cYou have reached the maximum rerolls for this quest group."
    no_quest_available: "&cNo replacement quest is available for reroll."
    specify_player_for_reroll: "&cYou must specify a player for reroll-others."
    quest_board_unavailable: "&cThe Quest Board is unavailable. Please contact a server administrator."
    quest_board_start_denied: "&cYou do not have permission to start this quest assignment."

    # Give command
    give_success: "&aThe quest '%quest_id%' has successfully been given to the player '%player%'."

    # Clear command
    clear_success: "&aThe quest '%quest_id%' has successfully been cleared for the player '%player%'."

    # Reset command (same-quest assignment restart)
    reset_success: "&aThe quest assignment '%quest_id%' has successfully been restarted for the player '%player%'."

    # Start commands
    start_success_others: "&aThe quest assignment '%quest_id%' has been started for the player '%player%'."
    start_success_self: "&aYour quest assignment '%quest_id%' has been started."

    # Reroll commands (different-quest replacement)
    reroll_success_others: "&aThe quest '%quest_id%' has successfully been rerolled for the player '%player%'."
    reroll_success_self: "&aYour quest '%quest_id%' has been successfully rerolled."

    # Complete command
    complete_success: "&aThe quest '%quest_id%' has successfully been completed for the player '%player%'."
