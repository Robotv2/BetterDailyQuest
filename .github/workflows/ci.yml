name: Build and test

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Validate repository automation and metadata
        run: |
          python scripts/test_delivery.py
          python scripts/test_release.py
          python scripts/check_delivery.py
          python scripts/release.py validate

      - name: Enforce pull-request policy
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: python scripts/check_delivery.py --base "${BASE_SHA}" --branch "${HEAD_BRANCH}"

      - name: Test and build plugin
        run: ./gradlew clean test shadowJar

      - name: Upload plugin candidate
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: plugin-candidate
          path: build/libs/*.jar
          if-no-files-found: error
