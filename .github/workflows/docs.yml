name: Administrator documentation

on:
  pull_request:
  push:
    branches:
      - master
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published release tag to deploy (for example, v0.0.12)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: docs-${{ (github.event_name == 'release' || inputs.release_tag != '') && 'production' || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' && inputs.release_tag == '' }}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NO_MKDOCS_2_WARNING: "true"
    steps:
      - name: Check out documentation source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install pinned documentation dependencies
        run: python -m pip install --requirement requirements-docs.txt

      - name: Validate documentation sources
        run: python scripts/validate_docs.py

      - name: Build documentation strictly
        run: python -m mkdocs build --strict

      - name: Upload pull-request preview
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: administrator-guide-preview
          path: build/docs-site
          if-no-files-found: error

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'release' || inputs.release_tag != ''
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/docs-site

  deploy:
    if: github.event_name == 'release' || inputs.release_tag != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Require a JAR release asset
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          jar_count="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" --jq '[.assets[].name | select(endswith(".jar"))] | length')"
          test "${jar_count}" -gt 0

      - name: Deploy release-matched guide
        id: deployment
        uses: actions/deploy-pages@v5
