plugins {
    id 'java'
    id("xyz.jpenilla.run-paper") version "2.3.1"
    id 'com.gradleup.shadow' version '8.3.2'
    id 'io.github.revxrsal.zapper' version '1.0.3'
    id 'maven-publish'
}

group = 'fr.robotv2'
version = '0.0.3'

repositories {
    mavenCentral()
    mavenLocal()
    maven { url = 'https://repo.alessiodp.com/releases/' }
    maven { url = "https://hub.spigotmc.org/nexus/content/repositories/snapshots/" }
    maven { url = 'https://jitpack.io' }
    maven { url = 'https://repo.extendedclip.com/releases/' }
}

dependencies {
    compileOnly("org.spigotmc:spigot-api:1.21.8-R0.1-SNAPSHOT")
    compileOnly('org.jetbrains:annotations:24.0.1')
    compileOnly("com.github.MilkBowl:VaultAPI:1.7")
    compileOnly 'me.clip:placeholderapi:2.11.6'

    testImplementation(platform("org.junit:junit-bom:5.10.2"))
    testImplementation("org.junit.jupiter:junit-jupiter")
    testImplementation("org.spigotmc:spigot-api:1.21.8-R0.1-SNAPSHOT")
    testImplementation("org.mockito:mockito-junit-jupiter:5.12.0")

    zap 'com.github.cryptomorin:XSeries:13.7.1'
    zap 'it.sauronsoftware.cron4j:cron4j:2.2.5'
    zap 'io.github.classgraph:classgraph:4.8.157'
    implementation 'com.github.Revxrsal.Lamp:common:3.3.6'
    implementation 'com.github.Revxrsal.Lamp:bukkit:3.3.6'
    // Anchor is not published to a public Maven repository yet. Bundle it so
    // production servers never depend on the build machine's local repository.
    implementation 'fr.robotv2.anchor:Anchor-bukkit:1.0-SNAPSHOT'
    implementation 'fr.robotv2.anchor:Anchor-mariadb:1.0-SNAPSHOT'
    implementation 'fr.robotv2.anchor:Anchor-sqlite:1.0-SNAPSHOT'
    runtimeOnly 'org.slf4j:slf4j-jdk14:2.0.17'
    zap 'com.github.Robotv2:PlaceholderAnnotationLib:v1.1.0'
}

tasks {
    runServer {
        minecraftVersion("1.21")
    }
}

def targetJavaVersion = 17
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'

    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

test {
    useJUnitPlatform()
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}

def bundledLibraryPrefix = 'fr.robotv2.betterdailyquest.libs'

zapper {
    libsFolder = '.libs'
    relocationPrefix = bundledLibraryPrefix
    repositories {
        maven('https://repo.maven.apache.org/maven2/')
        maven('https://repo.alessiodp.com/releases/')
        maven('https://hub.spigotmc.org/nexus/content/repositories/snapshots/')
        maven('https://jitpack.io')
        maven('https://repo.extendedclip.com/releases/')
    }
    relocate('com.cryptomorin.xseries', 'xseries')
    relocate('it.sauronsoftware.cron4j', 'cron4j')
    relocate('io.github.classgraph', 'classgraph')
    relocate('nonapi.io.github.classgraph', 'classgraph-nonapi')
    relocate('fr.robotv2.placeholderannotationlib', 'pal')
}

shadowJar {
    archiveClassifier.set('')
    mergeServiceFiles()
    // Lamp 3's optional Brigadier bridge cannot parse Paper's 26.2 API version.
    // BDQ does not register this bridge, so keep Lamp's standard Bukkit fallback.
    exclude('revxrsal/commands/bukkit/brigadier/**')
    relocate('fr.robotv2.anchor', "${bundledLibraryPrefix}.anchor")
    relocate('com.zaxxer.hikari', "${bundledLibraryPrefix}.hikari")
    relocate('net.byteflux.libby', "${bundledLibraryPrefix}.libby")
    relocate('org.slf4j', "${bundledLibraryPrefix}.slf4j")
    relocate('revxrsal.commands', "${bundledLibraryPrefix}.lamp")
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from(components.shadow)
        }
    }
}

apply from: "$rootDir/gradle/bdq-server-smoke.gradle"
