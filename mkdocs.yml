site_name: BetterDailyQuest Administrator Guide
site_description: Clear installation, quest creation, and server management guide for BetterDailyQuest administrators.
site_url: https://robotv2.github.io/BetterDailyQuest/
site_dir: build/docs-site
repo_url: https://github.com/Robotv2/BetterDailyQuest
repo_name: Robotv2/BetterDailyQuest
edit_uri: edit/master/docs/
copyright: BetterDailyQuest documentation

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.action.edit
    - content.code.copy
    - content.code.select
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.path
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow

plugins:
  - search

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path:
        - .
        - docs
      check_paths: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/feedback.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Robotv2/BetterDailyQuest
      name: BetterDailyQuest on GitHub

nav:
  - BetterDailyQuest administrator guide: index.md
  - Getting started:
      - Getting started: getting-started/index.md
      - Check the requirements: getting-started/requirements.md
      - Install BetterDailyQuest: getting-started/installation.md
      - Create your first quest: getting-started/first-quest.md
  - Creating quests:
      - Creating quests: creating-quests/index.md
      - Understand how quests work: creating-quests/how-it-works.md
      - Configure quest groups: creating-quests/quest-groups.md
      - Create quests and tasks: creating-quests/quests-tasks.md
      - Control quest assignment: creating-quests/assignments.md
      - Add progress conditions: creating-quests/conditions.md
      - Add rewards and progress messages: creating-quests/rewards-display.md
      - Test quest changes: creating-quests/testing.md
      - Quest recipe book: creating-quests/recipes.md
  - Server management:
      - Server management: administration/index.md
      - Use commands and permissions: administration/commands-permissions.md
      - Manage assignments and resets: administration/assignments-resets.md
      - Configure storage and backups: administration/storage-backups.md
      - Use integrations: administration/integrations.md
      - Reload, update, and collect support data: administration/updates-support.md
  - Reference:
      - Reference: reference/index.md
      - config.yml reference: reference/config.md
      - Quest group reference: reference/quest-groups.md
      - Quest and task reference: reference/quests-tasks.md
      - Task type overview: reference/task-types.md
      - Block task reference: reference/task-types-block.md
      - Entity task reference: reference/task-types-entity.md
      - Item task reference: reference/task-types-item.md
      - Player task reference: reference/task-types-player.md
      - Progress condition reference: reference/conditions.md
      - Reward action reference: reference/actions.md
      - Placeholder and cosmetic reference: reference/placeholders-cosmetics.md
      - Command and permission reference: reference/commands-permissions.md
      - Compatibility reference: reference/compatibility.md
